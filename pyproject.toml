[project]
name = "hermes-parliament"
version = "0.1.0"
description = "Multi-Agent Turn-Based Orchestrator for Hermes"
readme = "SPEC.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "structlog>=24.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
]

[project.scripts]
parliament = "parliament.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parliament"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
