[project]
name = "hermes-parliament"
version = "0.1.0"
description = "Multi-Agent Turn-Based Orchestrator for Hermes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "structlog>=24.1",
    "rich>=13.0",
    "pydantic>=2.0",
    "aiohttp>=3.9",
    "pyyaml>=6.0",
    "discord-py>=2.3",
    "orjson>=3.11.8",
]

[project.scripts]
parliament = "parliament.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["parliament"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "mypy>=1.20.2",
    "ruff>=0.15.11",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "B",
    "E",
    "F",
    "I",
    "UP",
    "W",
]
ignore = [
    "B904",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "B018",
]

[tool.mypy]
python_version = "3.11"
packages = [
    "parliament",
]
strict = true
warn_unused_configs = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "discord.*",
    "yaml.*",
]
ignore_missing_imports = true
